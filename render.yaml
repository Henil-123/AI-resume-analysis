services:
  - type: web
    name: ai-resume-analyzer
    runtime: docker
    dockerfilePath: deployment/Dockerfile
    envVars:
      - key: PORT
        value: 5000
      - key: APP_ENV
        value: production
      - key: SEMANTIC_ENGINE
        value: tfidf
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: resume_analyzer
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: REVIEW_API_TOKEN
        generateValue: true
      - key: MAX_FILE_MB
        value: 10
      - key: RETENTION_DAYS
        value: 90
    healthCheckPath: /health
    plan: free
