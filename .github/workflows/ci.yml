name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          # spaCy model comes pinned via requirements.txt; no extra downloads.
      - name: Fast test suite (light engine, throwaway DB, no secrets)
        env:
          SEMANTIC_ENGINE: tfidf
        run: |
          cd backend
          python -m pytest tests -q -p no:randomly
      - name: Semantic evaluation (light engine)
        env:
          SEMANTIC_ENGINE: tfidf
        run: |
          cd backend
          python -m eval.evaluate --engine tfidf
